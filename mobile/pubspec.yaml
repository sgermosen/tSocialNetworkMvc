name: tetas_mobile
description: Tetas mobile client - an educational social network built with Flutter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  adaptive_icon_background: "#0D9488"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generated: true
    image_path: "assets/icon/icon.png"
    background_color: "#0D9488"
    theme_color: "#0D9488"
